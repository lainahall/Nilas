[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nilas"
version = "0.1.0"
description = "Nilas milling strategy: adaptive polishing at low voltage and high tilt"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "adaptive-milling >= 0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points.'fibsem.strategies']
nilas = "nilas.strategy:NilasMillingStrategy"
